[project]
name = "portfolio-data-engineering"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "great-expectations>=1.19.1",
    "pg8000>=1.31",
]

[dependency-groups]
dev = [
    "pyspark>=3.5.4,<3.6",
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"
