[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not compat"
markers =
    compat: verifies whether a specific package/tool/version actually works in this stack (e.g. a new dependency, a new execution environment) rather than testing our own logic; only needs rerunning when that dependency version or tech choice changes, not on every regular run. Excluded by default via addopts — run explicitly with `pytest -m compat`, or `pytest -m ""` to run everything.
